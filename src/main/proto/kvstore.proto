syntax = "proto3";

option java_multiple_files = true;
option java_package="com.kvstore.grpc";

message PutRequest{
  string key = 1;
  string value = 2;
}

message PutResponse{
  bool successful = 1;
}

message GetRequest{
  string key = 1;
}

message GetResponse{
  string value = 1;
  bool found = 2;
}

service KVService{
  rpc put(PutRequest) returns (PutResponse);
  rpc get(GetRequest) returns (GetResponse);
}